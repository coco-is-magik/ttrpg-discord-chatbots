[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttrpg-chatbots"
version = "0.1.0"
description = "TTRPG chatbots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
stt = [
    "numpy>=2.0",
    "vosk>=0.3.45",
    "faster-whisper>=1.2",
    "sherpa-onnx>=1.13",
]
# Optional: only adds the zstd compressor. The reply engine itself is stdlib-only.
reply = ["zstandard>=0.25"]
# On-box neural text to speech. The playback layer needs no extra dependency.
tts = ["piper-tts>=1.8"]
# Formant-aware voice shifting: raises the pitch of a voice while leaving its formants (and so its
# perceived gender) alone. Needed by any casting rule that sets `pitch_hz` or `formant` -- a voice
# that asks for it without this installed is refused at load rather than left unshifted.
formants = ["praat-parselmouth>=0.4.4"]
# Joining a voice channel: encryption and the DAVE protocol. libopus is a system
# package (e.g. `apt install libopus0`), not a Python one.
voice = ["pynacl>=1.5", "davey>=0.1.7"]

[project.scripts]
ttrpg-chatbots = "ttrpg_chatbots.cli:main"
ttrpg-chatbots-bot = "ttrpg_chatbots.bot:main"
ttrpg-chatbots-stt = "ttrpg_chatbots.stt.cli:main"
ttrpg-chatbots-reply = "ttrpg_chatbots.reply.cli:main"
ttrpg-chatbots-tts = "ttrpg_chatbots.tts.cli:main"
ttrpg-chatbots-voice = "ttrpg_chatbots.voice.cli:main"
ttrpg-chatbots-persona = "ttrpg_chatbots.bots.persona_cli:main"
ttrpg-chatbots-llm = "ttrpg_chatbots.llm.cli:main"
ttrpg-chatbots-dice = "ttrpg_chatbots.dice.cli:main"
ttrpg-chatbots-simulate = "ttrpg_chatbots.ambient.cli:main"
ttrpg-chatbots-sheet = "ttrpg_chatbots.sheets.cli:main"
ttrpg-chatbots-character = "ttrpg_chatbots.character.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
